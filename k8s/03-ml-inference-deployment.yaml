# ========================================================
# Tier 3: ML Inference Engine (Private ClusterIP Service)
# ========================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cardiopulse-ml-engine-deployment
  namespace: cardiopulse-prod
  labels:
    app: cardiopulse-ml-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cardiopulse-ml-engine
  template:
    metadata:
      labels:
        app: cardiopulse-ml-engine
    spec:
      containers:
      - name: ml-engine-container
        image: cardiopulse-ml-engine:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        resources:
          requests:
            cpu: "100m"
            memory: "150Mi"
          limits:
            cpu: "300m"
            memory: "350Mi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cardiopulse-ml-engine-svc
  namespace: cardiopulse-prod
spec:
  type: ClusterIP
  selector:
    app: cardiopulse-ml-engine
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
